<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>متجرك | عناية بالبشرة</title>
<meta name="description" content="متجر عناية بالبشرة والمكياج والعطور">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- شريط الإعلانات المتحرك -->
<div class="marquee" aria-label="إعلانات"><div class="marquee__track" id="marquee"></div></div>

<!-- الهيدر -->
<header class="header">
  <button class="icon-btn" id="menuBtn" aria-label="القائمة">
    <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <nav class="nav-desktop" id="navDesktop"></nav>
  <a href="#" class="logo" id="logo"></a>
  <div class="header__actions">
    <button class="icon-btn" id="searchBtn" aria-label="بحث">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </button>
    <button class="icon-btn" id="cartBtn" aria-label="السلة">
      <svg viewBox="0 0 24 24"><path d="M3 4h2l2.5 11h10L20 7H7"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>
      <span class="count" data-cart-count>0</span>
    </button>
  </div>
</header>

<!-- البحث -->
<div class="search" id="search" hidden>
  <input type="search" id="searchInput" placeholder="ابحثي عن منتج..." autocomplete="off">
  <div class="search__results" id="searchResults"></div>
</div>

<main id="main"></main>

<footer class="footer" id="footer"></footer>

<!-- زر واتساب العائم -->
<a class="wa-float" id="waFloat" target="_blank" rel="noopener" aria-label="واتساب">
  <svg viewBox="0 0 24 24"><path fill="#fff" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.8 14.1c-.2.7-1.400 1.300-2 1.400-.5.1-1.200.1-1.900-.1-3.300-1.100-5.500-4.400-5.700-4.700-.2-.2-1.300-1.800-1.300-3.400s.8-2.400 1.100-2.700c.3-.3.600-.4.8-.4h.6c.2 0 .5-.1.700.5l1 2.400c.1.2.1.4 0 .6l-.9 1.200c-.2.2-.2.4-.1.600.9 1.600 2.200 2.700 3.900 3.400.2.1.4.1.600-.1l1-1.300c.2-.300.4-.2.7-.1l2.300 1.100c.300.1.4.2.5.3 0 .2 0 .7-.3 1.300z"/></svg>
</a>

<!-- الشريط السفلي للموبايل -->
<nav class="toolbar">
  <a href="#"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/></svg>الرئيسية</a>
  <a href="#" id="tbAccount"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>حساب</a>
  <a href="#sec-all"><svg viewBox="0 0 24 24"><path d="M4 9l1-5h14l1 5M5 9v11h14V9M9 20v-6h6v6"/></svg>المتجر</a>
  <a href="#" id="tbWish"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.500-7-10a4 4 0 0 1 7-2.500A4 4 0 0 1 19 10c0 5.500-7 10-7 10z"/></svg>المفضلة<span class="count" data-wish-count>0</span></a>
  <a href="#" id="tbCart"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.5 11h10L20 7H7"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>السلة<span class="count" data-cart-count>0</span></a>
</nav>

<!-- درج القائمة -->
<aside class="drawer drawer--menu" id="menuDrawer" aria-hidden="true">
  <div class="drawer__head"><strong>القائمة الرئيسية</strong><button class="icon-btn" data-close aria-label="إغلاق">✕</button></div>
  <ul class="menu-list" id="menuList"></ul>
</aside>

<!-- درج السلة -->
<aside class="drawer drawer--cart" id="cartDrawer" aria-hidden="true">
  <div class="drawer__head"><strong>سلة التسوق</strong><button class="icon-btn" data-close aria-label="إغلاق">✕</button></div>
  <div class="ship-bar"><p id="shipText"></p><div class="ship-bar__line"><i id="shipFill"></i></div></div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-foot">
    <div class="cart-total"><span>المجموع</span><b id="cartTotal">0</b></div>
    <button class="btn btn--primary" id="checkoutBtn">إتمام الطلب عبر واتساب</button>
  </div>
</aside>
<div class="overlay" id="overlay"></div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
